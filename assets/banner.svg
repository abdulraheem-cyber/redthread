<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="crimson-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="card-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <pattern id="grid-dots-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" fill-opacity="0.6" />
    </pattern>

    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E11D48" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="440" fill="url(#bg-grad-light)" />
  <rect width="1280" height="440" fill="url(#grid-dots-light)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1278" height="438" rx="0" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Top Crimson Accent Rule -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#crimson-bar)" />

  <!-- Decorative Minimalist Thread Paths -->
  <g opacity="0.45">
    <path d="M 60 210 Q 380 40 760 170 T 1220 90" fill="none" stroke="#E11D48" stroke-width="2" stroke-dasharray="3 5" />
    <path d="M 140 370 Q 520 180 900 320 T 1240 220" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="760" cy="170" r="4.5" fill="#E11D48" />
    <circle cx="900" cy="320" r="3.5" fill="#94A3B8" />
  </g>

  <!-- Brand Mark Icon Box (Crisp White Card with Ruby Icon) -->
  <g transform="translate(80, 68)">
    <rect width="96" height="96" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)" />
    
    <!-- Hexagon Frame -->
    <polygon points="48,16 80,34 80,70 48,88 16,70 16,34" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1.5" />
    
    <!-- Red Thread Knot Symbol -->
    <path d="M 28 62 Q 48 24 68 62" fill="none" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 28 42 Q 48 80 68 42" fill="none" stroke="#BE123C" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="48" cy="52" r="4.5" fill="#E11D48" />
  </g>

  <!-- Typography Block -->
  <g transform="translate(202, 70)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#FFE4E6" stroke="#FECDD3" stroke-width="1" />
    <circle cx="12" cy="13" r="4" fill="#E11D48" />
    <text x="24" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#BE123C">
      EXPOSURE VALIDATION &amp; DAST HARNESS
    </text>

    <!-- Project Title -->
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.5" fill="#0F172A">
      redthread<tspan fill="#E11D48">.</tspan>
    </text>

    <!-- Tagline -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="19" font-weight="500" fill="#334155">
      Scope-aware exposure validation with deterministic replay and zero false-positive tolerance.
    </text>

    <!-- Secondary descriptive copy -->
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="14.5" font-weight="400" fill="#64748B">
      Crawls web applications and APIs into a SQLite knowledge graph, guides exploration via bounded MCTS, and verifies every candidate twice.
    </text>
  </g>

  <!-- Feature Highlights Row (4 Cards) -->
  <g transform="translate(80, 260)">
    <!-- Card 1: Bounded Automation -->
    <g transform="translate(0, 0)">
      <rect width="260" height="126" rx="12" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)" />
      <rect x="0" y="0" width="4" height="126" rx="2" fill="#E11D48" />
      <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
        Bounded Exploration
      </text>
      <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        MCTS &amp; optional LLM guide
      </text>
      <text x="22" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        action selection, not exploit
      </text>
      <text x="22" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
        invention or hallucination.
      </text>
    </g>

    <!-- Card 2: Deterministic Replay Gate -->
    <g transform="translate(285, 0)">
      <rect width="260" height="126" rx="12" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)" />
      <rect x="0" y="0" width="4" height="126" rx="2" fill="#F43F5E" />
      <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
        Deterministic Replay Gate
      </text>
      <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        Checks produce candidates;
      </text>
      <text x="22" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        an independent secondary probe
      </text>
      <text x="22" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
        decides report inclusion.
      </text>
    </g>

    <!-- Card 3: Scope Guard & Safety -->
    <g transform="translate(570, 0)">
      <rect width="260" height="126" rx="12" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)" />
      <rect x="0" y="0" width="4" height="126" rx="2" fill="#0284C7" />
      <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
        Strict Scope Guard
      </text>
      <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        Explicit authorization gate
      </text>
      <text x="22" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        for remote hosts. Non-destructive
      </text>
      <text x="22" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
        methods &amp; rate limiters.
      </text>
    </g>

    <!-- Card 4: Knowledge Graph & SARIF -->
    <g transform="translate(855, 0)">
      <rect width="260" height="126" rx="12" fill="url(#card-grad-light)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)" />
      <rect x="0" y="0" width="4" height="126" rx="2" fill="#059669" />
      <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
        Knowledge Graph &amp; SARIF
      </text>
      <text x="22" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        Embedded SQLite graph
      </text>
      <text x="22" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#475569">
        with Neo4j export, SARIF for CI,
      </text>
      <text x="22" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">
        and request audit logging.
      </text>
    </g>
  </g>
</svg>